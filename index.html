<!doctype html>
<html lang="pt-br">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <script src="js/products.js" defer></script>
    <script src="js/cart.js" defer></script>
    <script src="js/main.js" defer></script>
    <title>Ateliê Digital</title>
    <link rel="stylesheet" href="css/style.css" />
    <link
      rel="stylesheet"
      href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css"
    />
  </head>
  <body>
    <nav class="nav">
      <div class="img-logo">
        <img src="assets/icons/logo.png" alt="logo" width="150px" />
      </div>
      <div class="btn">
        <button data-category="todos">Todos</button>
        <button data-category="croche">Crochê</button>
        <button data-category="bordado">Bordado</button>
        <button data-category="ceramica">Cerâmica</button>
        <button data-category="papelaria">Papelaria</button>
      </div>
      <div class="nav-actions">
        <div class="search-box">
          <input type="text" placeholder="Pesquisar" />
          <button><i class="fa-solid fa-magnifying-glass"></i></button>
        </div>
        <button class="cart"><i class="fa-solid fa-cart-shopping"></i></button>
        <button class="theme" id="theme-toggle">
          <i class="fa-solid fa-sun"></i>
        </button>
      </div>
    </nav>
    <main><section id="products"></section></main>
  </body>
</html>
